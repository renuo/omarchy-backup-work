# When backup-work runs. A run missed while the laptop was off happens at
# the next start. Syntax:
# https://www.freedesktop.org/software/systemd/man/latest/systemd.time.html#Calendar%20Events
# Check one with: systemd-analyze calendar 'Mon..Fri 12:30'

[Timer]
# The empty OnCalendar= clears the default before the next line sets one.
OnCalendar=
OnCalendar=hourly
#OnCalendar=daily
#OnCalendar=Mon..Fri 12:30

# Spreads the start, so not every laptop backs up on the hour sharp.
RandomizedDelaySec=10min
